server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API (and the SSE content stream) go to the Go api service.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # SSE: forward each event as soon as it arrives, keep long streams open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Hashed build assets can be cached for long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes are served index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
