# Test database for `make test`; separate project so it never shares a network with the app stack.
name: campaign-composer-test
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
